name: Release

# Publie une version : pousse un tag `v1.2.3` (le même numéro que versionName dans app/build.gradle.kts).
#   git tag v1.2.3 && git push origin v1.2.3
# L'APK est signé avec la clé stockée dans les secrets du dépôt (voir scripts/configurer-secrets-release.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # créer la release et y joindre l'APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Le tag correspond à la version de l'application
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$tag" != "$version" ]; then
            echo "::error::Le tag ($GITHUB_REF_NAME) ne correspond pas à versionName ($version). Corrige app/build.gradle.kts puis recrée le tag."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets de signature absents : lance scripts/configurer-secrets-release.sh. Un APK non signé ne peut pas être installé, rien n'est publié."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sillon.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sillon.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: APK release signé
        run: ./gradlew assembleRelease --console=plain

      - name: Vérification de la signature
        env:
          # Empreinte SHA-256 du certificat de signature de Sillon (publique) : refuse un APK signé par une autre clé.
          EXPECTED_CERT_SHA256: 76f1412cca2e534f2966a93d4d7342602d269654074e92a2d9c0fdf83d702a54
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner : $apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if ! grep -qi "SHA-256 digest: $EXPECTED_CERT_SHA256" signature.txt; then
            echo "::error::L'APK n'est pas signé par la clé attendue (empreinte $EXPECTED_CERT_SHA256). Rien n'est publié."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "Sillon-$VERSION.apk"
          sha256sum "Sillon-$VERSION.apk" > "Sillon-$VERSION.apk.sha256"

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Sillon-$VERSION.apk" "Sillon-$VERSION.apk.sha256" \
            --title "Sillon $VERSION" --generate-notes --verify-tag

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sillon.jks" keystore.properties
